name: EGO Gates

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run repo gates (ego-run)
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tools/ego-run.ps1

      - name: Live HEAD 200 smoke (retry)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $urls = @(
            'https://gluecklich-tools.github.io/einfach-geld-ordnen/seiten/downloads.html',
            'https://gluecklich-tools.github.io/einfach-geld-ordnen/seiten/freebie.html',
            'https://gluecklich-tools.github.io/einfach-geld-ordnen/seiten/vollversion.html'
          )
          foreach($u in $urls){
            Write-Host ("CHECK: {0}" -f $u)
            $ok = $false
            for($i=1; $i -le 20; $i++){
              try {
                $r = Invoke-WebRequest -Uri $u -Method Head -MaximumRedirection 10 -TimeoutSec 20
                if($r.StatusCode -eq 200){ $ok = $true; break }
              } catch { }
              Start-Sleep -Seconds 10
            }
            if(-not $ok){ throw ("LIVE-HEAD-200 FAIL: {0}" -f $u) }
          }
          Write-Host 'PASS: Live HEAD 200 smoke.'