name: ego-monthly-autopilot
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
permissions:
  contents: write
  issues: write
concurrency:
  group: ego-monthly-autopilot
  cancel-in-progress: false
jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git identity
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Guard law-run script must exist
        shell: powershell
        run: |
          $ErrorActionPreference="Stop"
          $p = Join-Path $PWD "tools\ego-law-run.ps1"
          if (-not (Test-Path -LiteralPath $p)) { throw ("Missing: " + $p) }
          Write-Host ("FOUND: " + $p)
      - name: LawRun
        shell: powershell
        run: |
          $ErrorActionPreference="Stop"
          Set-StrictMode -Version Latest
          Remove-Module PSReadLine -ErrorAction SilentlyContinue
          chcp 65001 > $null
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          $p = Join-Path $PWD "tools\ego-law-run.ps1"
          & $p
          if ($LASTEXITCODE -ne 0) { throw ("ego-law-run failed (exit " + $LASTEXITCODE + ")") }