name: "Linkcheck (HTMLProofer)"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: "Install dependencies (no Gemfile-safe)"
        shell: bash
        run: |
          set -euo pipefail
          gem install jekyll --no-document
          gem install html-proofer --no-document

      - name: "Build site (Jekyll)"
        shell: bash
        env:
          JEKYLL_ENV: "production"
        run: |
          set -euo pipefail
          rm -rf "_site"
          jekyll build

      - name: "Linkcheck (internal only, SHARP, baseurl-aware)"
        shell: bash
        run: |
          set -euo pipefail
          TARGET="./_site"

          # GitHub Pages Project Site: /einfach-geld-ordnen/ -> /
          SWAP="^/einfach-geld-ordnen$:/,^/einfach-geld-ordnen/:/"

          htmlproofer "$TARGET" \
            --assume-extension \
            --check-html \
            --only-4xx \
            --disable-external \
            --swap-urls "$SWAP" \
            --ignore-empty-alt \
            --ignore-missing-alt
