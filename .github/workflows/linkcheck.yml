name: "Linkcheck (HTMLProofer)"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      # GitHub Pages nutzt aktuell Ruby 3.3.x (und Jekyll 3.10.0) – siehe Versionsliste.
      # Wir bauen hier bundler-basiert, damit Plugins (z.B. jekyll-seo-tag für {% seo %}) sicher geladen werden.
      - name: "Setup Ruby (Bundler cache)"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: "Build site (Jekyll via Bundler)"
        shell: bash
        env:
          JEKYLL_ENV: "production"
        run: |
          set -euo pipefail
          rm -rf "_site"
          bundle exec jekyll build

      - name: "Linkcheck (internal only, baseurl-aware)"
        shell: bash
        run: |
          set -euo pipefail
          TARGET="./_site"

          # Project Site baseurl: /einfach-geld-ordnen/  -> server-root /
          SWAP="^/einfach-geld-ordnen$:/,^/einfach-geld-ordnen/:/"

          bundle exec htmlproofer "$TARGET" \
            --assume-extension \
            --check-html \
            --only-4xx \
            --disable-external \
            --swap-urls "$SWAP" \
            --ignore-empty-alt \
            --ignore-missing-alt
