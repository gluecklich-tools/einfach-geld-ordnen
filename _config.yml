title: "Einfach Geld ordnen"
description: "Einfaches Haushaltsbuch & Geld ordnen – statische Inhalte"
url: https://gluecklich-tools.github.io
baseurl: /einfach-geld-ordnen

markdown: "kramdown"

plugins:
  - "jekyll-seo-tag"

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  # Projekt-spezifisch
  - "tools"
  - "docs"
  - "freeze"
  - "archiv"
  - "_export_zips"
  - "README.md"

  # Build-/Dependency-Ordner (wichtig für GitHub Actions + Bundler)
  - "vendor"
  - "vendor/bundle"
  - "vendor/cache"
  - "vendor/gems"
  - "vendor/ruby"
  - ".bundle"
  - "node_modules"
