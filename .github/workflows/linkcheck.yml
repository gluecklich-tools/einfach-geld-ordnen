name: Linkcheck (HTMLProofer)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies (GitHub Pages compatible)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Gemfile" ]; then
            bundle config set path vendor/bundle
            bundle install --jobs 4 --retry 3
          else
            gem install github-pages --no-document
            gem install html-proofer --no-document
          fi

      - name: Build site (Jekyll)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "_site"
          if [ -f "Gemfile" ]; then
            bundle exec jekyll build
          else
            jekyll build
          fi

      - name: Linkcheck (internal only, SHARP, baseurl-aware)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="./_site"

          # GitHub Pages Project Site: /einfach-geld-ordnen/ soll auf / gemappt werden
          SWAP="^/einfach-geld-ordnen/:/"

          if [ -f "Gemfile" ]; then
            bundle exec htmlproofer "$TARGET" \
              --assume-extension \
              --check-html \
              --only-4xx \
              --disable-external \
              --swap-urls "$SWAP" \
              --ignore-empty-alt \
              --ignore-missing-alt
          else
            htmlproofer "$TARGET" \
              --assume-extension \
              --check-html \
              --only-4xx \
              --disable-external \
              --swap-urls "$SWAP" \
              --ignore-empty-alt \
              --ignore-missing-alt
          fi
