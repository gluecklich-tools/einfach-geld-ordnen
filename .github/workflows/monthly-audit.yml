name: monthly-audit
on:
  schedule:
    - cron: "15 3 1 * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Git identity
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run EGO law runner
        shell: powershell
        run: |
          .\tools\ego-law-run.ps1
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-assets
          path: |
            assets/audit
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "EGO Monthly Audit FAILED";
            const body =
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo +
              "/actions/runs/" + context.runId + "\n\n" +
              "Please check logs and fix, then re-run workflow_dispatch.";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });