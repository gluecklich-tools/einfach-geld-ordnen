name: enterprise-laws

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - recovery/**

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: env debug
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          pwsh --version
          git --version
          git rev-parse --short HEAD
          git branch --show-current
          Get-ChildItem -LiteralPath tools | Select-Object -First 50 | ForEach-Object { "$($_.Name)" }

      - name: gate public leaks
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/gate-public-leaks.ps1

      - name: gate unsafe heredoc
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/gate-no-unsafe-heredoc.ps1

      - name: make autopilot step in scratch
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/ci-make-autopilot-step.ps1 | Tee-Object -FilePath step_out.txt

      - name: enterprise autopilot (preflight + smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $line = (Get-Content step_out.txt -ErrorAction Stop | Select-String -Pattern '^STEP_OUT:\s+' | Select-Object -Last 1).Line
          if([string]::IsNullOrWhiteSpace($line)){ throw 'STOP: STEP_OUT line not found in step_out.txt' }
          $step = ($line -replace '^STEP_OUT:\s*','').Trim()
          if(!(Test-Path -LiteralPath $step)){ throw "STOP: StepPath not found: $step" }
          pwsh -NoProfile -File tools/enterprise-run.ps1 -StepPath $step

      - name: upload reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-reports
          path: |
            _local/reports/*.md
            _local/reports/*.txt
            **/enterprise_run_*.md
