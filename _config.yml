url: https://gluecklich-tools.github.io
baseurl: /einfach-geld-ordnen
title: "Einfach Geld ordnen"
description: "Einfaches Haushaltsbuch & Geld ordnen – statische Inhalte"

markdown: "kramdown"

plugins:
  - "jekyll-seo-tag"

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - vendor
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
  - .bundle
  - node_modules
  - _site
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata
  - Gemfile
  - Gemfile.lock
  - README.md
  - 00_ARCHIV
  - 01_governance
  - tools
  - templates
