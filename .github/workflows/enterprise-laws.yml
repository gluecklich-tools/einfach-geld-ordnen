name: enterprise-laws

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - recovery/**

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enterprise autopilot (preflight + smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          # hard marker: tools/smoke-checks.json
          pwsh -NoProfile -File tools/enterprise-run.ps1 -StepPath tools/enterprise-autopilot-step.ps1