name: ego-monthly-autopilot
"on":
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
permissions:
  contents: write
  issues: write
concurrency:
  group: ego-monthly-autopilot
  cancel-in-progress: false
jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git identity
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Guard: law-run script must exist
        shell: powershell
        run: |
          $ErrorActionPreference="Stop"
          if (-not (Test-Path -LiteralPath (Join-Path $PWD "tools\ego-law-run.ps1"))) {
            throw "Missing tools\ego-law-run.ps1 in repo workspace. Autopilot cannot run."
          }
      - name: LawRun (APPLY -> GATES -> Commit/Push if changes -> Live-HEAD-200)
        shell: powershell
        run: |
          $ErrorActionPreference="Stop"
          Set-StrictMode -Version Latest
          Remove-Module PSReadLine -ErrorAction SilentlyContinue
          chcp 65001 > $null
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          & (Join-Path $PWD "tools\ego-law-run.ps1")
          if ($LASTEXITCODE -ne 0) { throw ("ego-law-run failed (exit " + $LASTEXITCODE + ")") }
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ego-audit-artifacts
          path: |
            assets/audit/**
      - name: Create issue on FAIL
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `EGO Autopilot FAIL (${new Date().toISOString().slice(0,10)})`;
            const body =
              `Autopilot monthly run FAILED.\n\n` +
              `Run: ${runUrl}\n` +
              `Commit: ${context.sha}\n\n` +
              `Next action: Open the uploaded artifact "ego-audit-artifacts" and inspect logs / summary.\n`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });