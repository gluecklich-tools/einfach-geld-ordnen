name: enterprise-laws

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - recovery/**

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: env debug
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          pwsh --version
          git --version
          git rev-parse --short HEAD
          git branch --show-current
          Get-ChildItem -LiteralPath tools | Select-Object -First 50 | ForEach-Object { "$($_.Name)" }

      - name: enterprise autopilot (preflight + smoke)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          # marker: tools/smoke-checks.json
      - name: Make autopilot step in scratch
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/ci-make-autopilot-step.ps1 | Tee-Object -FilePath step_out.txt

      - name: enterprise autopilot (preflight + smoke)
        shell: pwsh
        run: |
          $line = (Get-Content step_out.txt | Select-String -Pattern '^STEP_OUT:\s+' | Select-Object -Last 1).Line
          $step = ($line -replace '^STEP_OUT:\s*','').Trim()
          pwsh -NoProfile -File tools/enterprise-run.ps1 -StepPath $step


      - name: upload reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-reports
          path: |
            _local/reports/*.md
            _local/reports/*.txt
            **/enterprise_run_*.md
            _INTERN/governance/_reports/*.md