name: Linkcheck (HTMLProofer)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies (GitHub Pages compatible)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Gemfile" ]; then
            echo "Gemfile found -> bundle install"
            bundle config set path vendor/bundle
            bundle install --jobs 4 --retry 3
          else
            echo "No Gemfile -> install github-pages + html-proofer via gem"
            gem install github-pages --no-document
            gem install html-proofer --no-document
          fi

      - name: Build site (Jekyll)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Gemfile" ]; then
            bundle exec jekyll build --verbose --trace
          else
            jekyll build --verbose --trace
          fi

      - name: Linkcheck (internal only)
        shell: bash
        run: |
          set -euo pipefail

          # baseurl aus _config.yml ziehen (z.B. /einfach-geld-ordnen)
          BASEURL="$(ruby -ryaml -e 'c=YAML.load_file("_config.yml") || {}; print(c["baseurl"].to_s)' 2>/dev/null || true)"
          echo "Detected baseurl: '${BASEURL}'"

          # wenn baseurl gesetzt ist: beim Prüfen weg-swappen, sonst bleiben Links kaputt
          URLSWAP=""
          if [ -n "${BASEURL}" ]; then
            URLSWAP="--url-swap ${BASEURL}/:/"
          fi

          if [ -f "Gemfile" ]; then
            bundle exec htmlproofer ./_site \
              $URLSWAP \
              --assume-extension \
              --check-html \
              --only-4xx \
              --disable-external \
              --ignore-empty-alt \
              --ignore-missing-alt
          else
            htmlproofer ./_site \
              $URLSWAP \
              --assume-extension \
              --check-html \
              --only-4xx \
              --disable-external \
              --ignore-empty-alt \
              --ignore-missing-alt
          fi
