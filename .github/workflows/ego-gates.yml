name: ego-gates
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
jobs:
  gates:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run required gates (tools/ego-run.ps1)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ego-run.ps1