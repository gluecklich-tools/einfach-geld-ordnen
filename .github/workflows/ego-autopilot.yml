name: ego-autopilot
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
concurrency:
  group: ego-autopilot
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
defaults:
  run:
    shell: powershell
jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Guard law-run must exist
        run: |
          $ErrorActionPreference="Stop"
          $p = Join-Path $PWD "tools\ego-law-run.ps1"
          if (-not (Test-Path -LiteralPath $p)) { throw ("Missing: " + $p) }
          Write-Host ("FOUND: " + $p)
      - name: LawRun (PS5.1 explicit)
        run: |
          $ErrorActionPreference="Stop"
          Set-StrictMode -Version Latest
          Remove-Module PSReadLine -ErrorAction SilentlyContinue
          chcp 65001 > $null
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $PWD "tools\ego-law-run.ps1")
          if ($LASTEXITCODE -ne 0) { throw ("ego-law-run failed (exit " + $LASTEXITCODE + ")") }