# marker: smoke-checks.json
# autopilot-ref: tools/smoke-checks.json
name: enterprise-laws

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - recovery/**

jobs:
  autopilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: env debug
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          pwsh --version
          git --version
          git rev-parse --short HEAD
          git branch --show-current
          Get-ChildItem -LiteralPath tools | Select-Object -First 120 | ForEach-Object { "$($_.Name)" }

      # Nur Gates, die im aktuellen Repo real vorhanden sind
      - name: gate-no-dollar-underscore-in-dq
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/gate-no-dollar-underscore-in-dq.ps1

      - name: gate-no-invalid-var-colon
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/gate-no-invalid-var-colon.ps1

      - name: enterprise autopilot step
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/enterprise-autopilot-step.ps1

      - name: upload reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-reports
          path: |
            _local/reports/*.md
            _local/reports/*.txt