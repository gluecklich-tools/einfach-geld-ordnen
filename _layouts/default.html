<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

  <header>
  <nav>
  {% for item in site.data.nav.main %}
    <a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% unless forloop.last %} | {% endunless %}
  {% endfor %}
</nav>

    <hr>
  </header>

  <main>
    {{ content }}
  </main>

</body>
</html>
